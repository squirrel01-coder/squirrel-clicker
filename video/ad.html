<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#070B18}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Рекламный Reels-ролик @autobiz.uz — детерминированная анимация: draw(t) рисует кадр на секунде t.
const W = 1080, H = 1920, DURATION = 18;
const c = document.getElementById('c'), x = c.getContext('2d');
const C = { bg1:'#070B18', bg2:'#0E1A3A', a1:'#3B82F6', a2:'#22D3EE', ok:'#A3E635', bad:'#F43F5E', txt:'#F8FAFC', dim:'#94A3B8' };
const F = 'Inter, "Inter Display", sans-serif';

const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eo = v => 1 - Math.pow(1 - v, 3);
const eb = v => { const s = 1.70158; return 1 + (s + 1) * Math.pow(v - 1, 3) + s * Math.pow(v - 1, 2); };
// Видимость сцены: появление за 0.35с, исчезновение за 0.35с
const vis = (t, a, b) => Math.min(eo(p(t, a, a + .35)), 1 - eo(p(t, b - .35, b)));

function grad(x0, y0, x1, y1) { const g = x.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, C.a1); g.addColorStop(1, C.a2); return g; }

function text(s, X, Y, size, opt = {}) {
  x.save();
  x.font = `${opt.w || 800} ${size}px ${F}`;
  x.textAlign = opt.align || 'center'; x.textBaseline = 'middle';
  x.globalAlpha *= opt.a ?? 1;
  x.fillStyle = opt.fill || C.txt;
  s.split('\n').forEach((line, i) => x.fillText(line, X, Y + i * size * (opt.lh || 1.15)));
  x.restore();
}

function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }

function background(t) {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // Мягкие светящиеся пятна
  [[200 + 80 * Math.sin(t * .5), 500, C.a1], [880 + 60 * Math.cos(t * .4), 1400, C.a2]].forEach(([X, Y, col]) => {
    const r = x.createRadialGradient(X, Y, 0, X, Y, 650);
    r.addColorStop(0, col + '33'); r.addColorStop(1, col + '00');
    x.fillStyle = r; x.fillRect(0, 0, W, H);
  });
  // Сетка
  x.save(); x.strokeStyle = '#ffffff0c'; x.lineWidth = 2;
  const off = (t * 30) % 90;
  for (let i = -1; i < 14; i++) { x.beginPath(); x.moveTo(0, i * 90 + off); x.lineTo(W, i * 90 + off); x.stroke(); }
  for (let i = 0; i < 13; i++) { x.beginPath(); x.moveTo(i * 90, 0); x.lineTo(i * 90, H); x.stroke(); }
  x.restore();
}

function gear(X, Y, r, rot, col, hole = C.bg1) {
  x.save(); x.translate(X, Y); x.rotate(rot); x.fillStyle = col;
  x.beginPath();
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, R = i % 2 ? r : r * 1.22; x.lineTo(Math.cos(a) * R, Math.sin(a) * R); }
  x.closePath(); x.fill();
  if (hole) { x.fillStyle = hole; x.beginPath(); x.arc(0, 0, r * .42, 0, 7); x.fill(); }
  x.restore();
}

function badge(X, Y, good, s = 1) {
  x.save(); x.translate(X, Y); x.scale(s, s);
  x.fillStyle = good ? C.ok : C.bad; x.beginPath(); x.arc(0, 0, 34, 0, 7); x.fill();
  x.strokeStyle = C.bg1; x.lineWidth = 9; x.lineCap = 'round'; x.beginPath();
  if (good) { x.moveTo(-15, 1); x.lineTo(-4, 13); x.lineTo(16, -11); }
  else { x.moveTo(-12, -12); x.lineTo(12, 12); x.moveTo(12, -12); x.lineTo(-12, 12); }
  x.stroke(); x.restore();
}

// Сцена 1 (0–3.2): хук + хаос ручной работы
function s1(t) {
  const v = vis(t, 0, 3.2); if (!v) return;
  x.save(); x.globalAlpha = v;
  const k = eb(p(t, .1, .7));
  x.save(); x.translate(W / 2, 560); x.scale(k, k);
  text('Всё ещё делаете\nэто вручную?', 0, 0, 104);
  x.restore();
  const cards = ['📊 Excel-таблицы', '📒 Заявки в блокноте', '📞 Звонки и напоминания', '🕙 Отчёты до ночи', '💬 Сотни сообщений'];
  cards.forEach((s, i) => {
    const a = eo(p(t, .6 + i * .22, 1.0 + i * .22)); if (!a) return;
    const shake = p(t, 1.6, 3.2) * 14;
    const X = W / 2 + (i % 2 ? 110 : -110) + Math.sin(t * 13 + i * 2) * shake;
    const Y = 960 + i * 128 + Math.cos(t * 11 + i) * shake;
    x.save(); x.globalAlpha *= a; x.translate(X, Y); x.rotate((i % 2 ? 1 : -1) * (.05 + .03 * Math.sin(t * 3 + i)));
    x.fillStyle = '#1E293B'; x.strokeStyle = C.bad + '99'; x.lineWidth = 3;
    rr(-300, -48, 600, 96, 24); x.fill(); x.stroke();
    text(s, 0, 2, 42, { w: 600 });
    x.restore();
  });
  x.restore();
}

// Сцена 2 (3.0–6.4): боли
function s2(t) {
  const v = vis(t, 3.0, 6.4); if (!v) return;
  x.save(); x.globalAlpha = v;
  text('Знакомо?', W / 2, 520, 120, { fill: grad(300, 0, 780, 0) });
  ['Заявки теряются', 'Отчёты — часами', 'Команда тонет\nв рутине'].forEach((s, i) => {
    const a = eo(p(t, 3.4 + i * .5, 3.85 + i * .5)); if (!a) return;
    const Y = 820 + i * 230, dx = (1 - a) * -120;
    x.save(); x.globalAlpha *= a; x.translate(dx, 0);
    badge(170, Y, false, eb(p(t, 3.4 + i * .5, 3.9 + i * .5)));
    text(s, 250, Y + (s.includes('\n') ? -34 : 0), 72, { align: 'left', w: 700 });
    x.restore();
  });
  x.restore();
}

// Сцена 3 (6.2–11.4): решение — цепочка автоматизации
function s3(t) {
  const v = vis(t, 6.2, 11.4); if (!v) return;
  x.save(); x.globalAlpha = v;
  const k = eb(p(t, 6.3, 6.9));
  x.save(); x.translate(W / 2, 400); x.scale(k, k);
  text('Мы автоматизируем', 0, 0, 84, { w: 700 });
  text('ваш бизнес', 0, 110, 130, { fill: grad(-330, 0, 330, 0), w: 900 });
  x.restore();
  gear(940, 700, 56, t * 1.4, C.a1 + '55', null); gear(1030, 790, 36, -t * 2.2, C.a2 + '55', null);
  const nodes = ['📥  Заявка с сайта', '🗂  CRM', '🤖  Telegram-бот', '📈  Отчёт руководителю'];
  const top = 820, step = 210;
  // Соединительные линии и бегущие импульсы
  for (let i = 0; i < 3; i++) {
    const a = p(t, 7.2 + i * .45, 7.6 + i * .45); if (!a) continue;
    const y0 = top + i * step + 55, y1 = y0 + (step - 110) * a;
    x.strokeStyle = grad(0, y0, 0, y0 + step); x.lineWidth = 8; x.beginPath(); x.moveTo(W / 2, y0); x.lineTo(W / 2, y1); x.stroke();
    if (t > 8.8) for (let j = 0; j < 2; j++) {
      const q = ((t * 1.3 + j * .5 + i * .33) % 1);
      x.fillStyle = C.a2; x.shadowColor = C.a2; x.shadowBlur = 25;
      x.beginPath(); x.arc(W / 2, y0 + (step - 110) * q, 11, 0, 7); x.fill(); x.shadowBlur = 0;
    }
  }
  nodes.forEach((s, i) => {
    const a = eb(p(t, 7.0 + i * .45, 7.5 + i * .45)); if (!a) return;
    const Y = top + i * step;
    x.save(); x.translate(W / 2, Y); x.scale(a, a);
    const glow = t > 8.8 ? .5 + .5 * Math.sin(t * 5 - i) : 0;
    x.shadowColor = C.a1; x.shadowBlur = 20 + 30 * glow;
    x.fillStyle = '#111C3D'; rr(-360, -55, 720, 110, 30); x.fill(); x.shadowBlur = 0;
    x.strokeStyle = grad(-360, 0, 360, 0); x.lineWidth = 4; rr(-360, -55, 720, 110, 30); x.stroke();
    text(s, 0, 2, 48, { w: 700 });
    x.restore();
  });
  text('Всё работает само', W / 2, 1720, 60, { w: 700, fill: C.a2, a: eo(p(t, 9.2, 9.7)) });
  x.restore();
}

// Сцена 4 (11.2–14.8): выгоды
function s4(t) {
  const v = vis(t, 11.2, 14.8); if (!v) return;
  x.save(); x.globalAlpha = v;
  text('Что вы получаете', W / 2, 470, 92, { w: 800 });
  ['Работает 24/7\nбез выходных', 'Ни одна заявка\nне теряется', 'Отчёты собираются\nавтоматически', 'Время — на рост,\nа не на рутину'].forEach((s, i) => {
    const a = eo(p(t, 11.6 + i * .45, 12.05 + i * .45)); if (!a) return;
    const Y = 700 + i * 250;
    x.save(); x.globalAlpha *= a; x.translate((1 - a) * 160, 0);
    x.fillStyle = '#ffffff0d'; rr(90, Y - 100, 900, 200, 36); x.fill();
    badge(190, Y, true, eb(p(t, 11.6 + i * .45, 12.1 + i * .45)));
    text(s, 270, Y - 30, 58, { align: 'left', w: 700, lh: 1.1 });
    x.restore();
  });
  x.restore();
}

// Сцена 5 (14.6–18): призыв к действию
function s5(t) {
  const a = eo(p(t, 14.6, 15.0)); if (!a) return;
  x.save(); x.globalAlpha = a;
  const k = eb(p(t, 14.7, 15.3));
  x.save(); x.translate(W / 2, 640); x.scale(k, k); x.rotate(t * .6);
  gear(0, 0, 120, 0, grad(-150, -150, 150, 150), null);
  x.fillStyle = C.bg1; x.beginPath(); x.arc(0, 0, 92, 0, 7); x.fill();
  x.restore();
  x.save(); x.translate(W / 2, 640); x.scale(k, k);
  text('A', 0, 6, 120, { w: 900, fill: grad(-60, -60, 60, 60) });
  x.restore();
  text('AutoBiz', W / 2, 880, 140, { w: 900, a: eo(p(t, 15.0, 15.4)) });
  text('Автоматизация бизнеса', W / 2, 1000, 58, { w: 600, fill: C.dim, a: eo(p(t, 15.2, 15.6)) });
  // Плашка с ником
  const pa = eb(p(t, 15.6, 16.1));
  if (pa) {
    const pulse = 1 + .03 * Math.sin(t * 6);
    x.save(); x.translate(W / 2, 1220); x.scale(pa * pulse, pa * pulse);
    x.shadowColor = C.a2; x.shadowBlur = 50;
    x.fillStyle = grad(-380, 0, 380, 0); rr(-380, -80, 760, 160, 80); x.fill(); x.shadowBlur = 0;
    text('@autobiz.uz', 0, 4, 80, { w: 900 });
    x.restore();
  }
  text('Пишите в Direct →', W / 2, 1420, 62, { w: 700, a: eo(p(t, 16.2, 16.6)) });
  text('Подпишитесь, чтобы не пропустить кейсы', W / 2, 1520, 40, { w: 500, fill: C.dim, a: eo(p(t, 16.5, 16.9)) });
  x.restore();
}

function draw(t) {
  background(t);
  s1(t); s2(t); s3(t); s4(t); s5(t);
  // Белая вспышка-переход между сценами
  [3.1, 6.3, 11.3, 14.7].forEach(T => { const d = Math.abs(t - T); if (d < .12) { x.fillStyle = `rgba(255,255,255,${.18 * (1 - d / .12)})`; x.fillRect(0, 0, W, H); } });
}
window.draw = draw; window.DURATION = DURATION;
document.fonts.load(`800 40px Inter`).then(() => { window.ready = true; draw(0); });
</script></body></html>
