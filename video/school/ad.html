const CAM = {};
function camImg(name, t) { const a = CAM[name], n = a.length; let k = Math.floor(t * 6) % (2 * n - 2); if (k >= n) k = 2 * n - 2 - k; return a[k]; }

function tabletUI(X, Y, w, h, cb) { x.save(); x.translate(X, Y); x.shadowColor = '#0B205044'; x.shadowBlur = 50; x.fillStyle = '#1E293B'; rr(-w / 2, -h / 2, w, h, 36); x.fill(); x.shadowBlur = 0; x.fillStyle = '#fff'; rr(-w / 2 + 18, -h / 2 + 18, w - 36, h - 36, 20); x.fill(); x.save(); rr(-w / 2 + 18, -h / 2 + 18, w - 36, h - 36, 20); x.clip(); x.translate(-w / 2 + 18, -h / 2 + 18); cb(w - 36, h - 36); x.restore(); x.restore(); }
