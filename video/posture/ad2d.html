<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Ролик «Ровная спина»: мультяшный персонаж показывает упражнения. draw(t), тайминги из timeline.json
const W = 1920, H = 1080, FL = 880, D2R = Math.PI / 180;
const out = document.getElementById('c'), o = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const x = buf.getContext('2d');
const F = 'Inter, sans-serif';
const C = { bg1: '#EAF2FB', bg2: '#F8FAFC', wall: '#DCE7F3', floor: '#E9DCC8', floor2: '#DCCBB2', mat: '#7DD3FC', navy: '#0B1F4D', dim: '#64748B', blue: '#2563EB', ok: '#16A34A', bad: '#DC2626', gold: '#F59E0B', teal: '#14B8A6' };
const SK = ['#F1C6A0', '#D8A882'], SH = ['#14B8A6', '#0E8C80'], PA = ['#1E3A8A', '#162B66'], SHOE = ['#F8FAFC', '#CBD5E1'], HAIR = '#2A1A12';
const L = { torso: 150, neck: 22, head: 36, ua: 84, fa: 80, th: 112, sh: 106 };
let PH = [], SC = {}, ORDER = [], DUR = 360;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p01 = (t, a, b) => clamp((t - a) / (b - a));
const sm = v => v * v * (3 - 2 * v);
const eo = v => 1 - Math.pow(1 - v, 3);
const eb = v => { const s = 1.7; return v <= 0 ? 0 : 1 + (s + 1) * Math.pow(v - 1, 3) + s * Math.pow(v - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const osc = (t, per) => .5 - .5 * Math.cos(2 * Math.PI * t / per);
function holdC(t, up, hold, down, rest) { const P = up + hold + down + rest, u = ((t % P) + P) % P; if (u < up) return sm(u / up); if (u < up + hold) return 1; if (u < up + hold + down) return 1 - sm((u - up - hold) / down); return 0; }
const dd = a => ({ x: Math.sin(a * D2R), y: Math.cos(a * D2R) });
const add = (A, v, k = 1) => ({ x: A.x + v.x * k, y: A.y + v.y * k });
const ang = (A, B) => Math.atan2(B.x - A.x, B.y - A.y) / D2R;
function ik(A, B, l1, l2, bend) { const dx = B.x - A.x, dy = B.y - A.y, d = clamp(Math.hypot(dx, dy), 1, l1 + l2 - .01), base = Math.atan2(dx, dy) / D2R;
  const off = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)) / D2R, a1 = base + bend * off, J = add(A, dd(a1), l1); return [a1, ang(J, B)]; }

// ---------- персонаж ----------
function anchors(p) { const t = dd(p.torso), n = { x: -t.y, y: t.x }, S0 = add(p.P, t, L.torso - 12), N = add(p.P, t, L.torso);
  if (p.view === 'front') return { t, n, S0, N, SA: add(S0, n, 50), SB: add(S0, n, -50), HA: add(p.P, n, 24), HB: add(p.P, n, -24) };
  return { t, n, S0, N, SA: S0, SB: add(S0, { x: -3, y: -2 }), HA: p.P, HB: add(p.P, { x: -3, y: -2 }) }; }
function stroke(A, B, w, col) { x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(A.x, A.y); x.lineTo(B.x, B.y); x.stroke(); }
function arm(S, a, far) { const [ua, fa, sc = 1] = a, k = far ? 1 : 0, E = add(S, dd(ua), L.ua), Hd = add(E, dd(fa), L.fa * sc);
  stroke(S, E, 24, SK[k]); stroke(S, add(S, dd(ua), L.ua * .45), 27, SH[k]); stroke(E, Hd, 20, SK[k]);
  x.fillStyle = SK[k]; x.beginPath(); x.arc(Hd.x, Hd.y, 12.5, 0, 7); x.fill(); return Hd; }
function leg(Hp, a, far, face = 1) { const [th, sh] = a, k = far ? 1 : 0, K = add(Hp, dd(th), L.th), A = add(K, dd(sh), L.sh);
  stroke(Hp, K, 32, SK[k]); stroke(Hp, add(Hp, dd(th), L.th * .55), 36, PA[k]); stroke(K, A, 26, SK[k]);
  const fd = dd(sh + 90 * face), T = add(A, fd, 30); stroke(A, T, 18, SHOE[k]); x.strokeStyle = '#94A3B8'; x.lineWidth = 3; return A; }
function headSide(Hc, neck, face = 1) { x.save(); x.translate(Hc.x, Hc.y); x.rotate((180 - neck) * D2R); x.scale(face, 1);
  x.fillStyle = SK[0]; x.beginPath(); x.arc(0, 0, L.head, 0, 7); x.fill();
  x.save(); x.beginPath(); x.arc(0, 0, L.head + 1, 0, 7); x.clip(); x.fillStyle = HAIR; x.fillRect(-40, -42, 82, 26); x.fillRect(-42, -42, 30, 52); x.beginPath(); x.ellipse(12, -16, 24, 10, -.3, 0, 7); x.fill(); x.restore();
  x.fillStyle = SK[1]; x.beginPath(); x.ellipse(-6, 4, 7, 10, 0, 0, 7); x.fill();
  x.fillStyle = '#1F2937'; x.beginPath(); x.arc(17, -3, 3.8, 0, 7); x.fill(); x.strokeStyle = HAIR; x.lineWidth = 3.5; x.beginPath(); x.moveTo(10, -13); x.lineTo(25, -12); x.stroke();
  x.fillStyle = SK[0]; x.beginPath(); x.arc(34, 6, 7, 0, 7); x.fill(); x.strokeStyle = '#B45309'; x.lineWidth = 3; x.beginPath(); x.arc(22, 16, 7, .2, 1.4); x.stroke(); x.restore(); }
function headFront(Hc, neck) { x.save(); x.translate(Hc.x, Hc.y); x.rotate((180 - neck) * D2R);
  x.fillStyle = SK[1]; x.beginPath(); x.ellipse(-35, 4, 7, 10, 0, 0, 7); x.ellipse(35, 4, 7, 10, 0, 0, 7); x.fill();
  x.fillStyle = SK[0]; x.beginPath(); x.arc(0, 0, L.head, 0, 7); x.fill();
  x.save(); x.beginPath(); x.arc(0, 0, L.head + 1, 0, 7); x.clip(); x.fillStyle = HAIR; x.fillRect(-40, -42, 80, 24); x.beginPath(); x.ellipse(-6, -18, 30, 9, .15, 0, 7); x.fill(); x.restore();
  x.fillStyle = '#1F2937'; x.beginPath(); x.arc(-13, -2, 4, 0, 7); x.arc(13, -2, 4, 0, 7); x.fill();
  x.strokeStyle = HAIR; x.lineWidth = 3.5; x.beginPath(); x.moveTo(-20, -12); x.lineTo(-7, -12); x.moveTo(7, -12); x.lineTo(20, -12); x.stroke();
  x.strokeStyle = '#B45309'; x.lineWidth = 3; x.beginPath(); x.arc(0, 10, 9, .4, 2.7); x.stroke(); x.restore(); }
function torsoSide(p, A) { const c = p.curve || [0, 0], M = { x: (p.P.x + A.N.x) / 2 + c[0], y: (p.P.y + A.N.y) / 2 + c[1] };
  x.strokeStyle = SH[0]; x.lineWidth = 62; x.lineCap = 'round'; x.beginPath(); x.moveTo(p.P.x + A.t.x * 18, p.P.y + A.t.y * 18); x.quadraticCurveTo(M.x, M.y, A.N.x - A.t.x * 6, A.N.y - A.t.y * 6); x.stroke();
  x.fillStyle = PA[0]; x.beginPath(); x.arc(p.P.x, p.P.y, 32, 0, 7); x.fill(); }
function torsoFront(p, A) { const { t, n, S0 } = A, P = p.P, pts = [add(add(P, n, 38), t, -6), add(add(S0, n, 56), t, 4), add(add(S0, n, -56), t, 4), add(add(P, n, -38), t, -6)];
  x.fillStyle = SH[0]; x.strokeStyle = SH[0]; x.lineWidth = 22; x.lineJoin = 'round'; x.beginPath(); pts.forEach((q, i) => i ? x.lineTo(q.x, q.y) : x.moveTo(q.x, q.y)); x.closePath(); x.fill(); x.stroke();
  const s = [add(add(P, n, 40), t, 22), add(add(P, n, -40), t, 22), add(add(P, n, -40), t, -26), add(add(P, n, 40), t, -26)];
  x.fillStyle = PA[0]; x.strokeStyle = PA[0]; x.lineWidth = 14; x.beginPath(); s.forEach((q, i) => i ? x.lineTo(q.x, q.y) : x.moveTo(q.x, q.y)); x.closePath(); x.fill(); x.stroke(); }
function drawP(p) {
  const A = anchors(p), face = p.face || 1, Hn = add(A.N, dd(p.neck), L.neck), Hc = add(A.N, dd(p.neck), L.neck + L.head - 6);
  const hands = {};

function stand(xc, view = 'side') { const p = { view, P: { x: xc, y: FL - 12 - L.th - L.sh + 3 }, torso: 180, neck: 180, armA: [6, 10], armB: [4, 8] };
  const A = anchors(p); const fx = view === 'front' ? 30 : 6; p.legA = ik(A.HA, { x: A.HA.x + (view === 'front' ? 12 : 4), y: FL - 12 }, L.th, L.sh, 1); p.legB = ik(A.HB, { x: A.HB.x - (view === 'front' ? 12 : 4), y: FL - 12 }, L.th, L.sh, 1);
  if (view === 'front') { p.armA = [12, 8]; p.armB = [-12, -8]; } return p; }

// ---------- окружение ----------
function room(t, mat) { const g = x.createLinearGradient(0, 0, 0, FL); g.addColorStop(0, C.bg1); g.addColorStop(1, C.wall); x.fillStyle = g; x.fillRect(0, 0, 1180, FL);
  x.fillStyle = C.floor; x.fillRect(0, FL, 1180, H - FL); x.fillStyle = C.floor2; for (let i = 0; i < 12; i++) x.fillRect(i * 110 - 20, FL, 3, H - FL); x.fillRect(0, FL, 1180, 6);
  // окно
  x.fillStyle = '#FFFFFF'; rr(860, 140, 220, 260, 14); x.fill(); x.fillStyle = '#BFDBFE'; rr(872, 152, 196, 236, 8); x.fill(); x.strokeStyle = '#FFFFFF'; x.lineWidth = 8; x.beginPath(); x.moveTo(970, 152); x.lineTo(970, 388); x.moveTo(872, 270); x.lineTo(1068, 270); x.stroke();
  x.fillStyle = '#22C55E'; x.beginPath(); x.ellipse(110, FL - 70, 34, 60, 0, 0, 7); x.fill(); x.fillStyle = '#B45309'; rr(84, FL - 34, 52, 34, 8); x.fill();
  if (mat) { x.fillStyle = C.mat; rr(170, FL - 10, 800, 16, 8); x.fill(); } }
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function T(s, X, Y, size, op = {}) { x.save(); x.font = `${op.w || 800} ${size}px ${F}`; x.textAlign = op.align || 'center'; x.textBaseline = 'middle'; x.globalAlpha *= op.a ?? 1; x.fillStyle = op.fill || C.navy; x.fillText(s, X, Y); x.restore(); }
function wrap(s, size, maxW, w = 800) { x.save(); x.font = `${w} ${size}px ${F}`; const Ls = []; let line = ''; for (const word of s.split(' ')) { const tt = line ? line + ' ' + word : word; if (x.measureText(tt).width > maxW && line) { Ls.push(line); line = word; } else line = tt; } if (line) Ls.push(line); x.restore(); return Ls; }
function arrow(X1, Y1, X2, Y2, col = C.blue, a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 8; x.lineCap = 'round'; x.beginPath(); x.moveTo(X1, Y1); x.lineTo(X2, Y2); x.stroke();
  const an = Math.atan2(Y2 - Y1, X2 - X1); x.beginPath(); x.moveTo(X2 + Math.cos(an) * 8, Y2 + Math.sin(an) * 8); x.lineTo(X2 - Math.cos(an - .5) * 22, Y2 - Math.sin(an - .5) * 22); x.lineTo(X2 - Math.cos(an + .5) * 22, Y2 - Math.sin(an + .5) * 22); x.closePath(); x.fill(); x.restore(); }
function tag(s, X, Y, col, a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.font = `800 30px ${F}`; const w = x.measureText(s).width + 36; x.fillStyle = col; rr(X - w / 2, Y - 26, w, 52, 26); x.fill(); T(s, X, Y + 1, 30, { fill: '#fff' }); x.restore(); }
function wall(x0, x1) { x.fillStyle = '#C9D7E6'; x.fillRect(x0, 120, x1 - x0, FL - 120); x.fillStyle = '#B6C7DA'; x.fillRect(x1 - 8, 120, 8, FL - 120); }
function towelRoll(X, Y) { x.fillStyle = '#FB923C'; x.beginPath(); x.ellipse(X, Y, 30, 20, 0, 0, 7); x.fill(); x.strokeStyle = '#EA580C'; x.lineWidth = 3; x.beginPath(); x.arc(X, Y, 12, 0, 7); x.stroke(); }

// ---------- сцены упражнений: pose(τ) ----------
function quad(Px, neutralCurve = [0, 0], neck = 100) { const P = { x: Px, y: FL - 14 - L.th }, Hd = { x: Px + 131, y: FL - 12 };
  const p = { view: 'side', P, torso: 110, neck, curve: neutralCurve }; const A = anchors(p);
  p.armA = ik(A.SA, Hd, L.ua, L.fa, -1); p.armB = ik(A.SB, { x: Hd.x - 4, y: Hd.y }, L.ua, L.fa, -1);
  p.legA = [ang(P, { x: Px, y: FL - 14 }), -90]; p.legB = [ang(P, { x: Px - 3, y: FL - 14 }), -90]; return p; }
const EX = {
  chin: { view: 'side', k: 1.25, props(t) { wall(260, 512); }, pose(t) { const q = holdC(t, .8, 2.2, .8, .7), p = stand(560); p.neck = 156 + 28 * q; p.armA = [2, 4]; p.armB = [1, 2]; return p; },
    fx(t, r) { const q = holdC(t, .8, 2.2, .8, .7); arrow(r.Hc.x + 70, r.Hc.y, r.Hc.x + 20 - 40 * q, r.Hc.y, C.blue, q > .05 && q < .99 ? 1 : .35); tag(q > .95 ? 'держим 5 сек' : 'затылок назад', r.Hc.x + 30, r.Hc.y - 110, q > .95 ? C.ok : C.blue); } },
  angel: { view: 'front', k: 1.2, props(t) { x.fillStyle = '#C9D7E6'; rr(330, 150, 460, FL - 150, 10); x.fill(); },
    pose(t) { const q = osc(t, 3.4), p = stand(560, 'front'); p.armA = [92 + 62 * q, 180 - 18 * q]; p.armB = [-(92 + 62 * q), -(180 - 18 * q)]; return p; },
    fx(t, r) { tag(osc(t, 3.4) > .5 ? 'вверх ↑' : 'локти к стене', 560, 190, C.blue); } },
  door: { view: 'side', k: 1.25, props(t) { x.fillStyle = '#A16207'; rr(472, 230, 30, FL - 230, 6); x.fill(); x.fillStyle = '#CA8A04'; rr(472, 230, 30, 14, 4); x.fill(); },
    pose(t) { const q = holdC(t, 1.5, 3, 1.5, .5), p = stand(580); p.torso = 180 - 9 * q; p.neck = 180 - 6 * q; const A = anchors(p);
      p.legA = ik(A.HA, { x: 650, y: FL - 12 }, L.th, L.sh, 1); p.legB = ik(A.HB, { x: 520, y: FL - 12 }, L.th, L.sh, 1);
      const el = { x: 500, y: A.S0.y + 4 }; const ua = ang(A.S0, el); p.armA = [ua, 178]; p.armB = [ua - 2, 176]; return p; },
    fx(t, r) { const q = holdC(t, 1.5, 3, 1.5, .5); x.save(); x.globalAlpha = .25 + .5 * q; x.fillStyle = '#F43F5E'; x.beginPath(); x.ellipse(r.A.S0.x + 26, r.A.S0.y + 34, 26, 34, 0, 0, 7); x.fill(); x.restore(); tag('шаг вперёд', 650, 230, C.blue); } },
  towelroll: { view: 'side', mat: 1, props(t) { towelRoll(492, FL - 26); },
    pose(t) { const q = holdC(t, 1.2, 1.4, 1.2, .5), P = { x: 640, y: FL - 34 }, p = { view: 'side', P, torso: -94 + 14 * q, neck: -86 + 4 * q, curve: [0, -16 * q] }; const A = anchors(p);
      p.legA = ik(P, { x: 800, y: FL - 12 }, L.th, L.sh, 1); p.legB = ik(P, { x: 795, y: FL - 14 }, L.th, L.sh, 1);
      const Hc = add(A.N, dd(p.neck), L.neck + L.head - 6), tg = { x: Hc.x + 10, y: Hc.y + 24 }; p.armA = ik(A.SA, tg, L.ua, L.fa, -1); p.armB = ik(A.SB, { x: tg.x - 4, y: tg.y - 4 }, L.ua, L.fa, -1); return p; },
    fx(t, r) { tag('валик под лопатками', 492, FL - 150, C.gold); } },
  sidebend: { view: 'front', k: 1.25, pose(t) { const q = holdC(t, 1.3, 2.6, 1.3, .4), p = stand(560, 'front'); p.torso = 180 - 17 * q; const A = anchors(p);
      p.armB = [180 - 26 * q, 178 - 40 * q]; p.armA = ik(A.SA, add(A.HA, { x: 18, y: -16 }), L.ua, L.fa, 1); return p; },

  catcow: { view: 'side', mat: 1, pose(t) { const s = Math.cos(2 * Math.PI * t / 5), cat = Math.max(0, s), cow = Math.max(0, -s);

    fx(t) { const s = Math.cos(2 * Math.PI * t / 5); tag(s > 0 ? 'выдох — спина вверх' : 'вдох — прогиб', 560, 520, s > 0 ? C.blue : C.teal); } },
  yw: { view: 'side', mat: 1, pose(t) { const ph = t % 8, Y = ph < 4, l = osc(ph, 2), P = { x: 420, y: FL - 26 }, p = { view: 'side', P, torso: 90, neck: 86, legA: [-90, -86], legB: [-89, -85] };

    fx(t, r) { const a = r.hands.A, b = r.hands.B; x.strokeStyle = '#FB923C'; x.lineWidth = 20; x.lineCap = 'round'; x.beginPath(); x.moveTo(b.x, b.y); x.quadraticCurveTo((a.x + b.x) / 2, (a.y + b.y) / 2 + 10, a.x, a.y); x.stroke(); tag('сжимаем лопатки', 560, 170, C.blue); } },
  scap: { view: 'side', mat: 1, pose(t) { const dr = 16 * osc(t, 2.2), Hd = { x: 720, y: FL - 12 }, S0 = { x: 720, y: FL - 12 - 160 + dr }, Ft = { x: 250, y: FL - 12 };
      const u = { x: Ft.x - S0.x, y: Ft.y - S0.y }, ul = Math.hypot(u.x, u.y), P = { x: S0.x + u.x / ul * (L.torso - 12), y: S0.y + u.y / ul * (L.torso - 12) };

      const u = { x: Ft.x - S0.x, y: Ft.y - S0.y }, ul = Math.hypot(u.x, u.y), P = { x: S0.x + u.x / ul * (L.torso - 12), y: S0.y + u.y / ul * (L.torso - 12) - lift };
      const p = { view: 'front', P, torso: ang(P, S0) }; p.neck = p.torso; const A = anchors(p);

      p.legA = ik(A.HA, Ft, L.th, L.sh, -1); p.legB = ik(A.HB, { x: Ft.x + 6, y: Ft.y - 26 }, L.th, L.sh, -1); return p; },
    fx(t, r) { tag('тело — одна линия', 520, 560, C.blue); tag('левый бок: 3 × 40 сек', 520, 640, C.ok); } },
  birddog: { view: 'side', mat: 1, pose(t) { const k = Math.floor(t / 3.2) % 2, e = holdC(t % 3.2, .9, 1.2, .9, .2), p = quad(470, [0, 0], 100);
      const AR = [92, 92], LG = [-86, -88];
      if (k === 0) { p.armA = [lerp(p.armA[0], AR[0], e), lerp(p.armA[1], AR[1], e)]; p.legB = [lerp(p.legB[0], LG[0], e), lerp(p.legB[1], LG[1], e)]; }
