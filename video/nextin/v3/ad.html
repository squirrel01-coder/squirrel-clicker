<script>
// Обзорный ролик Nextin (≈3,5 мин, 9:16). draw(t) рисует кадр; тайминги сцен и реплик — timeline.json (setup()).
const W = 1080, H = 1920, CX = 540, SX = 180, SW = 720;
const out = document.getElementById('c'), o = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const x = buf.getContext('2d');
const C = { bg1: '#04070F', bg2: '#0A1A3F', blue: '#0084FF', blue2: '#0059FF', cyan: '#38BDF8', ok: '#34D399', bad: '#F43F5E', warn: '#F97316', gold: '#FBBF24', txt: '#F8FAFC', dim: '#94A3B8', card: '#0E1C40', tg: '#229ED9', wa: '#25D366', violet: '#8B5CF6' };
const F = 'Inter, sans-serif';
let PH = [], SC = {}, ORDER = [], DUR = 200;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eo = v => 1 - Math.pow(1 - v, 3);
const eio = v => v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
const eb = v => { const s = 1.7; return v <= 0 ? 0 : 1 + (s + 1) * Math.pow(v - 1, 3) + s * Math.pow(v - 1, 2); };
const rnd = s => { const v = Math.sin(s * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };

function grad(x0, y0, x1, y1, a = C.blue2, b = C.cyan) { const g = x.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function T(s, X, Y, size, op = {}) {
  x.save(); x.font = `${op.w || 800} ${size}px ${F}`; x.textAlign = op.align || 'center'; x.textBaseline = 'middle';
  x.globalAlpha *= op.a ?? 1; x.fillStyle = op.fill || C.txt; if (op.glow) { x.shadowColor = op.glow; x.shadowBlur = 40; }
  String(s).split('\n').forEach((l, i) => x.fillText(l, X, Y + i * size * (op.lh || 1.15))); x.restore();
}
function wrap(s, size, maxW, w = 700) {
  x.save(); x.font = `${w} ${size}px ${F}`; const L = []; let line = '';
  for (const word of s.split(' ')) { const t = line ? line + ' ' + word : word; if (x.measureText(t).width > maxW && line) { L.push(line); line = word; } else line = t; }
  if (line) L.push(line); x.restore(); return L;
}
function pop(t, t0, X, Y, fn, d = .35) { const k = eb(p(t, t0, t0 + d)); if (k <= 0) return; x.save(); x.translate(X, Y); x.scale(k, k); x.globalAlpha *= clamp(k * 1.5); fn(); x.restore(); }
function kinetic(words, X, Y, size, t0, step, t, op = {}) {
  x.save(); x.font = `${op.w || 900} ${size}px ${F}`;
  const sp = size * .4, ws = words.map(w => x.measureText(w[0]).width), total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = X - total / 2; x.restore();
  words.forEach(([w, col], i) => { const a = eb(p(t, t0 + i * step, t0 + i * step + .35));
    if (a > 0) { x.save(); x.translate(cx + ws[i] / 2, Y + (1 - clamp(a)) * 40); x.scale(a, a); T(w, 0, 0, size, { w: op.w || 900, fill: col || C.txt, glow: op.glow }); x.restore(); }
    cx += ws[i] + sp; });
}
function card(X, Y, w, h, op = {}) {
  x.save(); if (op.glow) { x.shadowColor = op.glow; x.shadowBlur = 40; }
  x.fillStyle = op.fill || C.card; rr(X - w / 2, Y - h / 2, w, h, op.r || 34); x.fill(); x.shadowBlur = 0;
  if (op.stroke !== false) { x.strokeStyle = op.stroke || grad(X - w / 2, Y, X + w / 2, Y); x.lineWidth = 3; rr(X - w / 2, Y - h / 2, w, h, op.r || 34); x.stroke(); }
  x.restore();
}
function logo(X, Y, s, a = 1) {
  x.save(); x.translate(X, Y); x.scale(s, s); x.globalAlpha *= a;
  x.fillStyle = grad(-60, -60, 60, 60, '#1A6BFF', C.blue);
  x.beginPath(); x.moveTo(-58, 0); x.lineTo(-14, -44); x.lineTo(4, -26); x.lineTo(-22, 0); x.lineTo(4, 26); x.lineTo(-14, 44); x.closePath(); x.fill();
  x.fillStyle = grad(-20, -60, 60, 60, C.blue, C.cyan);
  x.beginPath(); x.moveTo(-6, 0); x.lineTo(32, -38); x.lineTo(70, 0); x.lineTo(32, 38); x.closePath(); x.fill(); x.restore();
}
function check(X, Y, s = 1, col = C.ok, bad = false) {
  x.save(); x.translate(X, Y); x.scale(s, s); x.fillStyle = bad ? C.bad : col; x.beginPath(); x.arc(0, 0, 26, 0, 7); x.fill();
  x.strokeStyle = '#04120C'; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath();
  if (bad) { x.moveTo(-9, -9); x.lineTo(9, 9); x.moveTo(9, -9); x.lineTo(-9, 9); } else { x.moveTo(-11, 1); x.lineTo(-3, 9); x.lineTo(12, -8); }

}
function phone(X, Y, w, h, cb, tilt = 0) {
  x.save(); x.translate(X, Y); x.rotate(tilt);
  x.shadowColor = '#0084FF66'; x.shadowBlur = 60; x.fillStyle = '#0B1020'; rr(-w / 2, -h / 2, w, h, 64); x.fill(); x.shadowBlur = 0;
  x.strokeStyle = '#2A3A66'; x.lineWidth = 6; rr(-w / 2, -h / 2, w, h, 64); x.stroke();
  x.save(); rr(-w / 2 + 16, -h / 2 + 16, w - 32, h - 32, 50); x.clip(); x.fillStyle = '#0F172A'; x.fillRect(-w / 2, -h / 2, w, h);
  x.translate(-w / 2 + 16, -h / 2 + 16); cb(w - 32, h - 32); x.restore();
  x.fillStyle = '#000'; rr(-60, -h / 2 + 28, 120, 30, 15); x.fill(); x.restore();

function msg(X, Y, w, s, mine, a, col, size = 32) {
  const L = wrap(s, size, w - 48, 500), h = 28 + L.length * size * 1.3; if (a <= 0) return h;
  x.save(); x.globalAlpha *= a; x.fillStyle = col || (mine ? C.blue2 : '#1F2A44'); rr(mine ? X - w : X, Y, w, h, 24); x.fill();
  L.forEach((l, i) => T(l, (mine ? X - w : X) + 22, Y + 14 + size * .65 + i * size * 1.3, size, { align: 'left', w: 500 })); x.restore(); return h;
}
function chip(s, X, Y, col, size = 34) {

  x.fillStyle = col; rr(X - w / 2, Y - size * .85, w, size * 1.7, size * .85); x.fill(); T(s, X, Y + 2, size, { w: 700 }); return w;

function background(t) {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2); x.fillStyle = g; x.fillRect(0, 0, W, H);

    const r = x.createRadialGradient(X, Y, 0, X, Y, R); r.addColorStop(0, col + '2a'); r.addColorStop(1, col + '00'); x.fillStyle = r; x.fillRect(0, 0, W, H); });
  x.save(); x.strokeStyle = '#38BDF818'; x.lineWidth = 2;
  for (let i = -8; i <= 8; i++) { x.beginPath(); x.moveTo(CX + i * 40, 1080); x.lineTo(CX + i * 260, H); x.stroke(); }
  for (let j = 0; j < 10; j++) { const q = ((j + (t * .5) % 1) / 10), y = 1080 + q * q * 840; x.globalAlpha = q; x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
  x.restore();
  x.save(); for (let i = 0; i < 70; i++) { const sx = rnd(i) * W, sy = (rnd(i + 99) * H - t * (18 + rnd(i + 7) * 50)) % H; x.globalAlpha = .2 + .35 * rnd(i + 3); x.fillStyle = i % 3 ? C.cyan : '#fff'; x.beginPath(); x.arc(sx, sy < 0 ? sy + H : sy, 1.4 + rnd(i + 5) * 2.4, 0, 7); x.fill(); } x.restore();
}
// Заставка главы: большая цифра и название, затем уезжает в шапку
function chapter(t, S, n, title, icon) {
  const a = S.start + .1, k = eo(p(t, a, a + .5)), up = eio(p(t, S.lines[1] - .5, S.lines[1]));
  x.save(); x.translate(CX, 760 - up * 200); x.globalAlpha *= 1 - up;
  T(String(n).padStart(2, '0'), 0, -150, 220 * (2 - k), { w: 900, fill: grad(-200, 0, 200, 0), glow: C.blue, a: k });
  T(icon, 0, 30, 90, { w: 400, a: k });
  T(title, 0, 170, 70, { w: 900, a: eo(p(t, a + .25, a + .7)), lh: 1.1 });
  x.restore();
  if (up > 0) T(String(n).padStart(2, '0') + '  ·  ' + title.replace('\n', ' '), CX, 300, 44, { w: 800, fill: C.cyan, a: up });
  // Индикатор глав 1..6
  for (let i = 1; i <= 6; i++) { const on = i === n; x.fillStyle = on ? C.cyan : i < n ? C.blue2 : '#ffffff22'; rr(CX - 195 + (i - 1) * 66, 236, 54, 10, 5); x.fill(); }
  return up;
}
