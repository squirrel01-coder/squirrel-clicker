<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Графика поверх живого видео (прозрачный холст). draw(t) рисует кадр; тайминги — timeline.json.
const W = 1080, H = 1920, CX = 540, SX = 180, SW = 720;
const c = document.getElementById('c'), x = c.getContext('2d');
const C = { blue: '#0084FF', blue2: '#0059FF', cyan: '#38BDF8', violet: '#8B5CF6', pink: '#EC4899', ok: '#10B981', bad: '#EF4444', gold: '#F59E0B', ink: '#0B1020', tg: '#229ED9', wa: '#25D366', ig: '#E1306C' };
const F = 'Inter, sans-serif';
let L = [], CUTS = [], DUR = 44;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eo = v => 1 - Math.pow(1 - v, 3);
const eio = v => v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
const eb = v => { const s = 1.8; return v <= 0 ? 0 : 1 + (s + 1) * Math.pow(v - 1, 3) + s * Math.pow(v - 1, 2); };
function grad(x0, y0, x1, y1, ...cols) { const g = x.createLinearGradient(x0, y0, x1, y1); cols.forEach((cl, i) => g.addColorStop(i / (cols.length - 1), cl)); return g; }
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function T(s, X, Y, size, op = {}) {
  x.save(); x.font = `${op.w || 800} ${size}px ${F}`; x.textAlign = op.align || 'center'; x.textBaseline = 'middle'; x.globalAlpha *= op.a ?? 1;
  String(s).split('\n').forEach((l, i) => { const yy = Y + i * size * 1.15;
    if (op.stroke) { x.lineJoin = 'round'; x.lineWidth = op.stroke; x.strokeStyle = op.strokeCol || '#0B1020cc'; x.strokeText(l, X, yy); }
    if (op.glow) { x.shadowColor = op.glow; x.shadowBlur = 30; }
    x.fillStyle = op.fill || '#fff'; x.fillText(l, X, yy); x.shadowBlur = 0; });
  x.restore();
}
function glass(X, Y, w, h, op = {}) {
  x.save(); x.shadowColor = '#0B102055'; x.shadowBlur = 40; x.shadowOffsetY = 12;
  x.fillStyle = op.fill || 'rgba(255,255,255,.92)'; rr(X - w / 2, Y - h / 2, w, h, op.r ?? 32); x.fill(); x.restore();
  if (op.accent) { x.save(); rr(X - w / 2, Y - h / 2, w, h, op.r ?? 32); x.clip(); x.fillStyle = op.accent; x.fillRect(X - w / 2, Y - h / 2, 14, h); x.restore(); }
}
function pop(t, t0, X, Y, fn, d = .35, rot = 0) { const k = eb(p(t, t0, t0 + d)); if (k <= 0) return; x.save(); x.translate(X, Y); x.scale(k, k); x.rotate(rot * (1 - clamp(k))); x.globalAlpha *= clamp(k * 1.6); fn(); x.restore(); }
function logo(X, Y, s) {
  x.save(); x.translate(X, Y); x.scale(s, s);
  x.fillStyle = grad(-60, -60, 60, 60, '#1A6BFF', C.blue); x.beginPath(); x.moveTo(-58, 0); x.lineTo(-14, -44); x.lineTo(4, -26); x.lineTo(-22, 0); x.lineTo(4, 26); x.lineTo(-14, 44); x.closePath(); x.fill();
  x.fillStyle = grad(-20, -60, 60, 60, C.blue, C.cyan); x.beginPath(); x.moveTo(-6, 0); x.lineTo(32, -38); x.lineTo(70, 0); x.lineTo(32, 38); x.closePath(); x.fill(); x.restore();
}
function icon(X, Y, r, col, ch) { x.fillStyle = col; x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); T(ch, X, Y + 2, r * 1.1, { w: 400 }); }
function kinetic(words, X, Y, size, t0, step, t, op = {}) {
  x.save(); x.font = `900 ${size}px ${F}`; const sp = size * .3, ws = words.map(w => x.measureText(w[0]).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1); x.restore();
  let cx = X - tot / 2; words.forEach(([w, col], i) => { const k = eb(p(t, t0 + i * step, t0 + i * step + .3)); if (k > 0) { x.save(); x.translate(cx + ws[i] / 2, Y); x.scale(k, k); T(w, 0, 0, size, { w: 900, fill: col || '#fff', stroke: op.stroke ?? 12 }); x.restore(); } cx += ws[i] + sp; });
}
const S = [
  // 0 Клиенты пишут: уведомления
  (t, a, b) => {
    const n = [['✈', C.tg, 'Telegram', 'Здравствуйте! Сколько стоит?'], ['✆', C.wa, 'WhatsApp', 'Вы сегодня работаете?'], ['◎', C.ig, 'Instagram', 'Есть доставка?'], ['✈', C.tg, 'Telegram', 'Можно заказать на завтра?']];
    n.forEach(([ic, col, app, s], i) => pop(t, a + .25 + i * .55, CX, 330 + i * 150, () => { glass(0, 0, 700, 128, { accent: col }); icon(-270, 0, 38, col, ic); T(app, -210, -24, 26, { align: 'left', w: 700, fill: '#64748B' }); T(s, -210, 18, 34, { align: 'left', w: 700, fill: C.ink }); T('сейчас', 320, -26, 22, { align: 'right', w: 500, fill: '#94A3B8' }); }, .35, .2));
    pop(t, a + .4, 900, 250, () => { x.fillStyle = C.bad; x.beginPath(); x.arc(0, 0, 50, 0, 7); x.fill(); T(String(Math.min(27, Math.floor(p(t, a + .4, b) * 40))), 0, 3, 40, { w: 900 }); });
  },
  // 1 Совещание / дорога / сон
  (t, a) => {
    [['📅  Совещание', C.violet], ['🚗  В дороге', C.gold], ['😴  Спите', C.blue2]].forEach(([s, col], i) => pop(t, a + .5 + i * .8, CX + (i - 1) * 40, 420 + i * 170, () => { x.fillStyle = col; x.shadowColor = '#0006'; x.shadowBlur = 30; rr(-270, -62, 540, 124, 62); x.fill(); x.shadowBlur = 0; T(s, 0, 3, 54, { w: 900 }); }, .35, (i - 1) * .3));
  },
  // 2 Заявки уходят
  (t, a, b) => {
    for (let i = 0; i < 4; i++) { const t0 = a + .4 + i * .6, q = eio(p(t, t0 + .7, t0 + 1.6)); pop(t, t0, CX + q * 700, 360 + i * 130, () => { x.globalAlpha *= 1 - q; glass(0, 0, 620, 104, { accent: C.bad }); T('❌  Заявка #' + (318 + i) + ' потеряна', -10, 2, 38, { w: 800, fill: C.ink }); }); }
    pop(t, a + 1.8, CX, 980, () => { T('−4 клиента', 0, 0, 120, { w: 900, fill: grad(-300, 0, 300, 0, '#FCA5A5', C.bad), stroke: 14 }); });
  },
  // 3 Nextin + ИИ-помощник
  (t, a) => {
    const k = eb(p(t, a, a + .5));
    for (let i = 0; i < 20; i++) { const ang = i / 20 * 7 + t * .4, len = 160 + 520 * eo(p(t, a, a + .9)); x.save(); x.globalAlpha = .35 * (1 - p(t, a + .5, a + 2.5)); x.strokeStyle = [C.cyan, C.violet, C.blue][i % 3]; x.lineWidth = 8; x.beginPath(); x.moveTo(CX + Math.cos(ang) * 120, 600 + Math.sin(ang) * 120); x.lineTo(CX + Math.cos(ang) * len, 600 + Math.sin(ang) * len); x.stroke(); x.restore(); }
    pop(t, a, CX, 600, () => { glass(0, 0, 620, 300, { r: 48 }); logo(-215, -10, 1.15); T('Nextin', 65, -6, 110, { w: 900, fill: C.ink }); }, .5);
    pop(t, a + 1.6, CX, 880, () => { x.fillStyle = grad(-330, 0, 330, 0, C.blue2, C.violet, C.pink); x.shadowColor = C.violet; x.shadowBlur = 40; rr(-330, -70, 660, 140, 70); x.fill(); x.shadowBlur = 0; T('🤖  ИИ-помощник 24/7', 0, 3, 52, { w: 900 }); });
  },
  // 4 Чат: ответ, заказ, менеджер
  (t, a) => {
    pop(t, a + .1, CX, 360, () => { glass(0, 0, 700, 130, { fill: 'rgba(255,255,255,.95)' }); T('Добрый вечер! Хочу заказать\n2 торта на субботу', -320, -18, 34, { align: 'left', w: 600, fill: C.ink }); });
    pop(t, a + .9, CX + 20, 530, () => { x.fillStyle = grad(-340, 0, 340, 0, C.blue2, C.blue); x.shadowColor = '#0006'; x.shadowBlur = 30; rr(-340, -80, 680, 160, 32); x.fill(); x.shadowBlur = 0; T('Отлично! 2 торта на субботу.\nДоставка к 12:00 — подтверждаете?', -310, -22, 34, { align: 'left', w: 700 }); });
    pop(t, a + 1.0, CX + 260, 440, () => { x.fillStyle = C.ok; rr(-100, -26, 200, 52, 26); x.fill(); T('⚡ 0,8 сек', 0, 2, 28, { w: 900 }); });
    pop(t, a + 2.1, CX, 740, () => { glass(0, 0, 600, 110, { accent: C.ok }); T('✅  Заказ №1047 принят', 0, 2, 42, { w: 800, fill: C.ink }); });
    pop(t, a + 3.2, CX, 890, () => { glass(0, 0, 600, 110, { accent: C.violet }); T('👨‍💼  Передано менеджеру', 0, 2, 42, { w: 800, fill: C.ink }); });
  },
  // 5 Отчёт
  (t, a) => {
    const k = eb(p(t, a + .1, a + .5)); if (!k) return;
    x.save(); x.translate(CX, 380 + (1 - clamp(k)) * -250); x.globalAlpha *= clamp(k);
    glass(0, 0, 760, 330, { r: 40 }); logo(-310, -110, .45); T('Отчёт за сегодня · 21:00', -260, -112, 32, { align: 'left', w: 800, fill: C.ink });
    [['Заявки', 47, C.blue2], ['Продажи', 12, C.ok], ['Выручка', 18, C.violet]].forEach(([s, v, col], i) => { const q = eo(p(t, a + .6 + i * .3, a + 1.6 + i * .3));
      T(s, -320 + i * 230, -40, 26, { align: 'left', w: 600, fill: '#64748B' }); T((i === 2 ? '+' : '') + Math.round(v * q) + (i === 2 ? '%' : ''), -320 + i * 230, 10, 54, { align: 'left', w: 900, fill: col });
      for (let j = 0; j < 5; j++) { const hh = (20 + 50 * ((j * 37 + i * 11) % 7) / 7) * q; x.fillStyle = col + 'aa'; rr(-320 + i * 230 + j * 30, 120 - hh, 20, hh, 6); x.fill(); } });
    x.restore();
  },
  // 6 Услуги + под ключ
  (t, a) => {
    [['🌐', 'Сайты', C.blue2], ['📱', 'Приложения', C.violet], ['💬', 'Чат-боты', C.tg], ['📊', 'Системы продаж', C.pink]].forEach(([ic, s, col], i) =>
      pop(t, a + .2 + i * .7, CX + (i % 2 ? 175 : -175), 430 + Math.floor(i / 2) * 260, () => { glass(0, 0, 330, 220, { r: 36 }); x.fillStyle = col; x.beginPath(); x.arc(0, -40, 50, 0, 7); x.fill(); T(ic, 0, -38, 52, { w: 400 }); T(s, 0, 60, 34, { w: 900, fill: C.ink }); }, .35, (i % 2 ? .4 : -.4)));
    pop(t, a + 3.6, CX, 1010, () => { x.rotate(-.06); x.strokeStyle = C.gold; x.lineWidth = 10; rr(-250, -70, 500, 140, 24); x.stroke(); T('ПОД КЛЮЧ', 0, 4, 80, { w: 900, fill: C.gold, stroke: 10 }); }, .3);
  },
  // 7 Больше клиентов, меньше рутины
  (t, a) => {
    kinetic([['Больше'], ['клиентов', '#7DD3FC']], CX, 470, 92, a + .1, .25, t);
    kinetic([['Меньше'], ['рутины', '#F9A8D4']], CX, 620, 92, a + 1.5, .25, t);
  },
  // 8 CTA
  (t, a) => {
    const k = eo(p(t, a - .1, a + .4)); x.save(); x.globalAlpha *= k; x.fillStyle = grad(0, 0, 0, H, '#0B1020ee', '#0B1020aa', '#0B1020ee'); x.fillRect(0, 0, W, H); x.restore();
    pop(t, a, CX, 330, () => { logo(-215, 0, .95); T('Nextin', 50, 4, 96, { w: 900 }); }, .45);
    T('Первая консультация', CX, 500, 64, { w: 800, a: eo(p(t, a + .4, a + .8)) });
    pop(t, a + 1.0, CX, 610, () => T('БЕСПЛАТНО', 0, 0, 110, { w: 900, fill: grad(-350, 0, 350, 0, C.cyan, '#fff', '#F9A8D4') }), .4);
    pop(t, a + 1.7, CX, 800, () => { const pl = 1 + .04 * Math.sin(t * 7); x.scale(pl, pl); x.fillStyle = grad(-340, 0, 340, 0, C.blue2, C.violet, C.pink); x.shadowColor = C.violet; x.shadowBlur = 50; rr(-340, -80, 680, 160, 80); x.fill(); x.shadowBlur = 0; T('Пишите в Direct →', 0, 4, 58, { w: 900 }); });
    const ca = eo(p(t, a + 2.4, a + 2.8));
    T('📞  +998 77 777 16 68', CX, 1000, 54, { w: 800, a: ca }); T('✈  @dosd_nextin', CX, 1090, 50, { w: 700, fill: '#7DD3FC', a: ca }); T('🌐  nextin.uz', CX, 1180, 50, { w: 700, fill: '#C4B5FD', a: ca });
  },
];
function captions(t) {
  const l = L.find(s => t >= s[0] - .05 && t <= s[1] + .2); if (!l) return;
  const [s0, s1, text] = l, words = text.split(' '), tot = words.reduce((n, w) => n + w.length + 1, 0);
  let acc = 0, cur = words.length - 1; for (let k = 0; k < words.length; k++) { acc += words[k].length + 1; if (t < s0 + (s1 - s0) * acc / tot) { cur = k; break; } }
  x.save(); x.font = `900 46px ${F}`; const lines = []; let line = [];
  for (const w of words) { if (x.measureText([...line, w].join(' ')).width > SW && line.length) { lines.push(line); line = []; } line.push(w); } lines.push(line);
  const Y0 = 1400 - (lines.length - 1) * 58; let idx = 0;
  lines.forEach((ln, li) => { let cx = CX - x.measureText(ln.join(' ')).width / 2;
    ln.forEach(w => { x.lineJoin = 'round'; x.lineWidth = 12; x.strokeStyle = '#000'; x.textBaseline = 'middle'; x.strokeText(w, cx, Y0 + li * 58);
      x.fillStyle = idx === cur ? '#FDE047' : '#fff'; x.fillText(w, cx, Y0 + li * 58); cx += x.measureText(w + ' ').width; idx++; }); });
  x.restore();
}
function draw(t) {
  x.clearRect(0, 0, W, H);
  // Мягкие затемнения сверху и снизу для читаемости
  let g = x.createLinearGradient(0, 0, 0, 500); g.addColorStop(0, '#0B102088'); g.addColorStop(1, '#0B102000'); x.fillStyle = g; x.fillRect(0, 0, W, 500);
  g = x.createLinearGradient(0, 1150, 0, H); g.addColorStop(0, '#0B102000'); g.addColorStop(1, '#0B1020cc'); x.fillStyle = g; x.fillRect(0, 1150, W, H - 1150);
  const bounds = [0, ...CUTS, DUR];
  S.forEach((fn, i) => { const a = i ? L[i][0] : L[0][0], s = bounds[i], e = bounds[i + 1]; if (t < s - .05 || t > e + .05) return; x.save(); x.globalAlpha = Math.min(clamp((t - s) / .12), clamp((e - t) / .12)) || (i === 8 ? 1 : 0); fn(t, a, e); x.restore(); });
  captions(t);
  // Цветная «шторка» на каждом монтажном стыке
  CUTS.forEach(cut => { const q = p(t, cut - .22, cut + .22); if (q <= 0 || q >= 1) return; const X = -600 + q * 2300;
    x.save(); x.translate(X, H / 2); x.rotate(-.35); x.fillStyle = grad(-260, 0, 260, 0, '#38BDF800', C.cyan, C.violet, C.pink, '#EC489900'); x.fillRect(-260, -1400, 520, 2800); x.restore();
    const f = 1 - Math.abs(t - cut) / .22; x.fillStyle = `rgba(255,255,255,${.25 * f})`; x.fillRect(0, 0, W, H); });
}
window.setup = d => { L = d.lines; CUTS = d.cuts; DUR = d.duration; return DUR; };
window.draw = draw;
document.fonts.load(`800 40px Inter`).then(() => { window.ready = true; });
</script></body></html>
